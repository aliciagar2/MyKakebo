services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kakebo
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kakebo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: