name: "CodeQL Analysis (Java)"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 0 * * 0" # Ejecución semanal los domingos

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Java JDK (Ajusta la versión a 17 u 21 según tu proyecto)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Inicializar las herramientas de CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Opcional: define las reglas estándar de seguridad
          queries: security-extended,security-and-quality

      # Intento de compilación automática (detecta Maven/Gradle automáticamente)
        # - name: Autobuild
      #   uses: github/codeql-action/autobuild@v3
      - name: Build with Maven
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      # Si Autobuild falla, comenta el paso anterior y descomenta esto para Maven manual:
      # - name: Build with Maven
      #   run: mvn clean package -DskipTests

      # Ejecutar el análisis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
