apiVersion: v1
kind: Namespace
metadata:
  name: kakebo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kakebo-api
  namespace: kakebo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kakebo-api
  template:
    metadata:
      labels:
        app: kakebo-api
    spec:
      containers:
        - name: api
          image: docker.io/library/kakebo-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kakebo-api
  namespace: kakebo
spec:
  selector:
    app: kakebo-api
  ports:
    - port: 8080
      targetPort: 8080